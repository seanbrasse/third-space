# App name is reserved in Sean's personal organization; paid resources await approval.
# There are no deployed machines, volumes or IPs yet.
app = "third-space-seanbrasse"
primary_region = "iad"
kill_signal = "SIGTERM"
kill_timeout = 30

[build]
  dockerfile = "deployment/Dockerfile.game-server"

[env]
  NODE_ENV = "production"
  GAME_HOST = "0.0.0.0"
  GAME_PORT = "2567"
  DATA_PATH = "/data/third-space.sqlite"
  # Exact stable production frontend origin, no wildcard preview access.
  WEB_ORIGIN = "https://third-space-topaz.vercel.app"

[[mounts]]
  source = "third_space_data"
  destination = "/data"

[http_service]
  internal_port = 2567
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/ready"

[[vm]]
  cpu_kind = "shared"
  # Published 2-shared-CPU / 512 MiB preset quoted at $3.89/mo in iad;
  # with a 1 GB volume the starting resource base is $4.04/mo.
  cpus = 2
  memory = "512mb"
